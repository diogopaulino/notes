<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE56A"/>
      <stop offset="45%" stop-color="#FCB827"/>
      <stop offset="100%" stop-color="#E09A10"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFEF8"/>
      <stop offset="100%" stop-color="#F7F1DE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#8A5A00" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS continuous corner squircle approximation -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- soft highlight -->
  <path d="M0 0h1024v420C700 380 320 420 0 520Z" fill="#ffffff" opacity="0.14"/>
  <!-- notepad -->
  <g filter="url(#shadow)">
    <rect x="232" y="168" width="560" height="688" rx="56" fill="url(#paper)"/>
  </g>
  <!-- top bar -->
  <rect x="232" y="168" width="560" height="92" rx="56" fill="#FFF8E0"/>
  <rect x="232" y="220" width="560" height="40" fill="#FFF8E0"/>
  <line x1="232" y1="260" x2="792" y2="260" stroke="#E8D9A8" stroke-width="6"/>
  <!-- ruled lines -->
  <g stroke="#E2D5B0" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="312" y1="360" x2="712" y2="360"/>
    <line x1="312" y1="440" x2="712" y2="440"/>
    <line x1="312" y1="520" x2="712" y2="520"/>
    <line x1="312" y1="600" x2="620" y2="600"/>
  </g>
  <!-- amber accent stroke -->
  <line x1="312" y1="340" x2="520" y2="340" stroke="#FCB827" stroke-width="14" stroke-linecap="round"/>
  <!-- folded corner -->
  <path d="M680 856h112v-112Z" fill="#E8D9A8"/>
  <path d="M680 856V744h112Z" fill="#FFF8E0"/>
  <path d="M680 744l112 112" stroke="#D4C08E" stroke-width="6"/>
</svg>
